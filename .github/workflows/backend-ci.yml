name: Production Pipeline

on:
  push:
    paths:
      - 'docker-demo/src/**'
    branches: ["main"]
  workflow_dispatch:
  
jobs:
  code-pushing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build docker image
        run: |
          cd docker-demo
          ./mvnw clean package
          docker build -t ghcr.io/shreshthtarwey/lpu-war2-image:1.0 .
      
      - name: Login to GHCR
        uses: Docker/login-action@v3
        with:
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}
      
      - name: Push To GHCR
        run: |
          cd docker-demo
          docker push ghcr.io/shreshthtarwey/lpu-war2-image:1.0