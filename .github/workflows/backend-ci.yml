name: Live Runner Validation Test

on:
  workflow_dispatch: # Allows us to trigger it manually via the button

jobs:
  local-execution-job:
    runs-on: self-hosted # 💡 CRITICAL: This routes the job straight to your laptop!
    
    steps:
      - name: Validate Connection
        run: echo "Automation script is running locally on Shreshth's Laptop!"

      - name: Display Host Machine Name
        run: hostname

      - name: Show Current Active System User
        run: whoami